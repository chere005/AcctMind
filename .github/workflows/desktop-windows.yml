# AcctMind Desktop for Windows — manual only.
#
# Tauri cannot cross-compile from the Mac, so the .msi/.exe are built on a
# Windows runner from the same web export the site serves. Trigger it from
# the Actions tab when a Windows build is actually wanted; it never runs on
# push, because nothing here is on the critical path of a deploy.
name: desktop-windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      # The gates that do not need a browser. A Windows bundle built from
      # code that fails the typecheck is a bundle nobody should install.
      # TWO STEPS, not one `run:` block with two lines. The default shell on a
      # windows runner is pwsh, which fails the step on the LAST command's exit
      # code only — so a broken typecheck would have been masked by a core
      # suite that then passed, and the job would have gone green with a type
      # error in it.
      - name: Typecheck
        run: npm run typecheck
      - name: Core suite
        run: npm run test:core

      # export:web, not a bare `expo export` — the head patch and the build
      # stamp ride in it, and the Windows bundle should carry the same
      # index.html the site serves.
      - name: Export the web app
        run: npm run export:web

      - name: Build the Windows bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop

      # The runner IS a Windows machine with a desktop session, so the smoke
      # that would otherwise wait for a person runs here: install the MSI the
      # way a user's machine would, launch what it installed, and hold it to
      # the mac smoke's bar — it launches, it survives, it can be closed.
      # A window showing an error page still passes, the same honest
      # limitation desktop/smoke.sh states.
      - name: Smoke the MSI on the runner
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI to smoke' }
          Write-Host "installing $($msi.Name)"
          # msiexec's EXIT CODE, checked. Without -PassThru and this test a
          # failed install walked on to the search below and reported "the MSI
          # installed nothing named AcctMind.exe" — which blames the bundle for
          # an install that never happened, and is what this job said for its
          # first three runs.
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit $($p.ExitCode)" }
          # BOTH names, and the three places Windows installs to. productName is
          # AcctMind but the crate is acctmind-desktop, and which one names the
          # binary is Tauri's business, not this script's.
          $exe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA\Programs" -Recurse -Include AcctMind.exe,acctmind-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the MSI reported success but installed no AcctMind binary' }
          Write-Host "launching $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "the installed app exited within 8 seconds (code $($app.ExitCode))" }
          # The window takes a beat to be titled; three looks over six seconds.
          $title = ''
          foreach ($i in 1..3) {
            $title = (Get-Process -Id $app.Id -ErrorAction SilentlyContinue).MainWindowTitle
            if ($title -like '*AcctMind*') { break }
            Start-Sleep -Seconds 2
          }
          if ($title -notlike '*AcctMind*') { throw "the app is running but shows no AcctMind window - got '$title'" }
          Write-Host "window up: '$title' - stopping it"
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        with:
          name: acctmind-windows
          # error, not the default warn: a green run that uploaded NOTHING is
          # the kind of check that cannot fail. CalMind's job learned this by
          # doing exactly that once.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
