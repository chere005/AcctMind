<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    AcctMind: the AM mark. One unbroken stroke — the A's right leg dips through
    a shallow curve at the foot and rises again as the M's stem, the same move
    CalMind's CM makes where the C becomes the M. Sean's pick: join "B" (the
    smoothest of the eight), centred on the measured ink box.

    Centring note: the box is measured from the INK, not the path numbers. The
    cubic at the join reaches 74.875 rather than the 76 its control points
    suggest, and the round caps add half the stroke (3.5) on every side.
    Trusting the handles would sit the mark low.

    Regenerate every raster from this file: sh tools/make-icons.sh
  -->
  <rect width="96" height="96" rx="20" fill="#111111"/>
  <rect x="4" y="4" width="88" height="88" rx="16.5" fill="none" stroke="#34d399" stroke-width="3.5"/>
  <path d="M 16 74.5 L 36 20.5 L 57 73.5 C 58 76 59 76 60 73.5 L 60 46.5 L 70 59.5 L 80 46.5 L 80 74.5"
        fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
